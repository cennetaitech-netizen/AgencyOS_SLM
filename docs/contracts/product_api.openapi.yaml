openapi: 3.1.0
info:
  title: AgencyOS product API, as used by the AgencyOS Assistant
  version: 1.0.0
  description: |
    The operations the assistant needs from the AgencyOS product. Every request carries the signed-in user's own
    bearer token, so the product applies that user's permissions: the assistant never sees more than the user can.
    Rules that aren't expressible here (money units, idempotency, latency) are in PRODUCT_API.md next to this file.
    Check an implementation with: python ops/check_product_api.py --base-url <url> --token <test user token>
    Paths can differ in the real product: map them in chat_service/tools/product.py (ENDPOINTS); the response
    shapes are what the assistant relies on.
servers:
  - url: https://agencyos.example
security:
  - bearerAuth: []

paths:
  /api/v1/me:
    get:
      operationId: me
      summary: Who the token belongs to (used to sign the user in to the assistant)
      responses:
        "200": {description: The user, content: {application/json: {schema: {$ref: "#/components/schemas/Me"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/clients:
    get:
      operationId: list_clients
      summary: Clients (brands) this user can access
      parameters: [{$ref: "#/components/parameters/RequestId"}]
      responses:
        "200": {description: Clients, content: {application/json: {schema: {$ref: "#/components/schemas/ClientList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/campaigns:
    get:
      operationId: list_campaigns
      summary: Campaigns this user can access, optionally filtered
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
        - {name: client_id, in: query, required: false, schema: {type: string}}
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/CampaignStatus"}}
      responses:
        "200": {description: Campaigns, content: {application/json: {schema: {$ref: "#/components/schemas/CampaignList"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/campaigns/{campaign_id}:
    parameters:
      - {$ref: "#/components/parameters/CampaignId"}
      - {$ref: "#/components/parameters/RequestId"}
    get:
      operationId: get_campaign_details
      summary: Current settings of one campaign
      responses:
        "200": {description: Campaign, content: {application/json: {schema: {$ref: "#/components/schemas/CampaignDetails"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      operationId: update_campaign
      summary: Change the total budget or the name (only after the user confirmed it in the assistant)
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                budget: {type: number, exclusiveMinimum: 0, description: New total budget in major currency units}
                name: {type: string, minLength: 3, maxLength: 120}
      responses:
        "200": {$ref: "#/components/responses/WriteOk"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Rejected"}

  /api/v1/campaigns/{campaign_id}/pause:
    post:
      operationId: pause_campaign
      parameters:
        - {$ref: "#/components/parameters/CampaignId"}
        - {$ref: "#/components/parameters/RequestId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {$ref: "#/components/responses/WriteOk"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/campaigns/{campaign_id}/resume:
    post:
      operationId: resume_campaign
      parameters:
        - {$ref: "#/components/parameters/CampaignId"}
        - {$ref: "#/components/parameters/RequestId"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200": {$ref: "#/components/responses/WriteOk"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/campaigns/{campaign_id}/pacing:
    get:
      operationId: get_budget_pacing
      summary: Budget, spend to date and flight progress of one campaign
      parameters:
        - {$ref: "#/components/parameters/CampaignId"}
        - {$ref: "#/components/parameters/RequestId"}
      responses:
        "200": {description: Pacing, content: {application/json: {schema: {$ref: "#/components/schemas/Pacing"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/performance:
    get:
      operationId: get_campaign_performance
      summary: Delivery and results for one campaign, or all of a client's campaigns, over a date range
      description: Give campaign_id or client_id. Dates are inclusive, in the org's timezone.
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
        - {name: campaign_id, in: query, required: false, schema: {type: string}}
        - {name: client_id, in: query, required: false, schema: {type: string}}
        - {name: date_from, in: query, required: true, schema: {type: string, format: date}}
        - {name: date_to, in: query, required: true, schema: {type: string, format: date}}
        - name: breakdown
          in: query
          required: false
          schema: {type: string, enum: [none, platform, day, campaign], default: none}
      responses:
        "200": {description: Performance, content: {application/json: {schema: {$ref: "#/components/schemas/Performance"}}}}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/help/search:
    get:
      operationId: search_help_docs
      summary: Search AgencyOS help articles
      parameters:
        - {$ref: "#/components/parameters/RequestId"}
        - {name: query, in: query, required: true, schema: {type: string, minLength: 2}}
      responses:
        "200": {description: Articles, content: {application/json: {schema: {$ref: "#/components/schemas/HelpResults"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, description: The signed-in AgencyOS user's own token}

  parameters:
    CampaignId: {name: campaign_id, in: path, required: true, schema: {type: string}}
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: The assistant's request ID; log it so support can trace one chat message across both systems
      schema: {type: string, maxLength: 64}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Same key = same change. A repeated request with a key already used must return the first result and not
        apply the change again (the assistant retries after timeouts). Keep keys for at least 24 hours.
      schema: {type: string, maxLength: 128}

  responses:
    WriteOk: {description: Change applied, content: {application/json: {schema: {$ref: "#/components/schemas/WriteResult"}}}}
    BadRequest: {description: Invalid parameters, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Unauthorized: {description: Missing, invalid or expired token, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Forbidden: {description: The user may not see or change this item, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    NotFound: {description: No such item (or not visible to this user), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Conflict: {description: The item's state doesn't allow this change (e.g. campaign ended), content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
    Rejected: {description: The ad platform or a product rule rejected the change, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}

  schemas:
    Error:
      type: object
      required: [detail]
      properties: {detail: {type: string, description: Human-readable reason; the assistant may show it to the user}}

    Me:
      type: object
      required: [user_id, org_id, roles]
      properties:
        user_id: {type: string, format: uuid}
        org_id: {type: string, format: uuid}
        workspace_id: {type: [string, "null"], format: uuid}
        display_name: {type: string}
        roles:
          type: array
          items: {type: string}
          description: Includes "org_admin" for organisation admins (assistant settings and billing)

    DataAsOf: {type: string, format: date-time, description: When the figures were last refreshed (UTC)}
    Currency: {type: string, pattern: "^[A-Z]{3}$", description: ISO 4217 code of all money in the response}
    CampaignStatus: {type: string, enum: [active, paused, ended]}

    Client:
      type: object
      required: [client_id, name]
      properties: {client_id: {type: string}, name: {type: string}}

    Campaign:
      type: object
      required: [campaign_id, client_id, name, platform, status, budget, flight_start, flight_end]
      properties:
        campaign_id: {type: string}
        client_id: {type: string}
        name: {type: string}
        platform: {type: string, description: "e.g. google_ads, meta, linkedin, tiktok"}
        status: {$ref: "#/components/schemas/CampaignStatus"}
        budget: {type: number, minimum: 0, description: Total flight budget in major currency units (e.g. 300000 = INR 3,00,000)}
        flight_start: {type: string, format: date}
        flight_end: {type: string, format: date}

    ClientList:
      type: object
      required: [data_as_of, rows]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        rows: {type: array, items: {$ref: "#/components/schemas/Client"}}

    CampaignList:
      type: object
      required: [data_as_of, currency, rows]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        currency: {$ref: "#/components/schemas/Currency"}
        rows: {type: array, items: {$ref: "#/components/schemas/Campaign"}}

    CampaignDetails:
      allOf:
        - {$ref: "#/components/schemas/Campaign"}
        - type: object
          required: [data_as_of, currency]
          properties:
            data_as_of: {$ref: "#/components/schemas/DataAsOf"}
            currency: {$ref: "#/components/schemas/Currency"}

    Pacing:
      type: object
      required: [data_as_of, currency, campaign_id, name, budget, spend_to_date, days_elapsed, total_days]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        currency: {$ref: "#/components/schemas/Currency"}
        campaign_id: {type: string}
        name: {type: string}
        budget: {type: number, minimum: 0}
        spend_to_date: {type: number, minimum: 0}
        days_elapsed: {type: integer, minimum: 0}
        total_days: {type: integer, minimum: 1}

    Metrics:
      type: object
      required: [impressions, clicks, spend, conversions, revenue, ctr_pct, cpc, cpm, cpa, roas]
      properties:
        impressions: {type: integer, minimum: 0}
        clicks: {type: integer, minimum: 0}
        spend: {type: number, minimum: 0}
        conversions: {type: number, minimum: 0}
        revenue: {type: number, minimum: 0}
        ctr_pct: {type: [number, "null"], description: Percent (1.93 = 1.93%); null when there were no impressions}
        cpc: {type: [number, "null"]}
        cpm: {type: [number, "null"]}
        cpa: {type: [number, "null"]}
        roas: {type: [number, "null"], description: Revenue ÷ spend (2.74 = 274%)}

    Performance:
      type: object
      required: [data_as_of, currency, date_range, scope, totals, rows]
      properties:
        data_as_of: {$ref: "#/components/schemas/DataAsOf"}
        currency: {$ref: "#/components/schemas/Currency"}
        date_range:
          type: object
          required: [from, to]
          properties: {from: {type: string, format: date}, to: {type: string, format: date}}
        scope: {type: array, items: {type: string}, description: Names of the campaigns included}
        totals: {$ref: "#/components/schemas/Metrics"}
        rows:
          type: array
          maxItems: 50
          description: One row per breakdown value (empty when breakdown=none); each row has the breakdown key
          items:
            allOf:
              - {$ref: "#/components/schemas/Metrics"}
              - type: object
                properties:
                  platform: {type: string}
                  day: {type: string, format: date}
                  campaign: {type: string}

    HelpResults:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          maxItems: 10
          items:
            type: object
            required: [title]
            properties:
              title: {type: string}
              steps: {type: string}
              url: {type: string}
              snippet: {type: string}

    WriteResult:
      type: object
      required: [ok, campaign]
      properties:
        ok: {const: true}
        campaign: {$ref: "#/components/schemas/Campaign"}
