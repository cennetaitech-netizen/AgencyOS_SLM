{{- if .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "aos.fullname" . }}
  labels:
    {{- include "aos.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- /* files/alerts.yml is a copy of ops/prometheus/alerts.yml (tests/test_helm_chart.py keeps them equal) */}}
  {{- .Files.Get "files/alerts.yml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
