{{- if and (eq .Values.environment "production") (not (or .Values.secrets.existingSecret .Values.secrets.create)) }}
{{- fail "environment=production needs secrets.existingSecret (or secrets.create): the database URL, Redis URL, metrics token and encryption keys come from it" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aos.fullname" . }}-api
  labels:
    {{- include "aos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 25%, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "aos.selector" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aos.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      {{- with .Values.api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aos.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      containers:
        - name: api
          image: {{ include "aos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - uvicorn
            - chat_service.api.app:create_app
            - --factory
            - --host=0.0.0.0
            - --port=8090
            - --workers={{ .Values.api.workers }}
            - --proxy-headers
            - --forwarded-allow-ips={{ .Values.api.forwardedAllowIps }}
            - --timeout-keep-alive=75
          ports:
            - name: http
              containerPort: 8090
          env:
            {{- include "aos.env" . | nindent 12 }}
          {{- include "aos.envFrom" . | nindent 10 }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "aos.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "aos.volumes" . | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if .Values.api.topologySpreadConstraints }}
        {{- toYaml .Values.api.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "aos.selector" (dict "ctx" . "component" "api") | nindent 14 }}
        {{- end }}
