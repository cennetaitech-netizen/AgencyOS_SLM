apiVersion: v1
kind: Service
metadata:
  name: {{ include "aos.fullname" . }}
  labels:
    {{- include "aos.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
    # The ServiceMonitor uses this as Prometheus' job label: the alerts and dashboard filter on it.
    agencyos.io/prometheus-job: agencyos-assistant
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "aos.selector" (dict "ctx" . "component" "api") | nindent 4 }}
