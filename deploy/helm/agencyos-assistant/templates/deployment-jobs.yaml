{{- if .Values.jobs.enabled }}
# Exactly one replica, replaced rather than rolled, so two copies never run the billing jobs at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aos.fullname" . }}-jobs
  labels:
    {{- include "aos.labels" . | nindent 4 }}
    app.kubernetes.io/component: jobs
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "aos.selector" (dict "ctx" . "component" "jobs") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aos.labels" . | nindent 8 }}
        app.kubernetes.io/component: jobs
      {{- with .Values.jobs.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aos.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: jobs
          image: {{ include "aos.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["python", "-m", "chat_service.jobs", "--interval", "{{ .Values.jobs.intervalSeconds }}"]
          env:
            {{- include "aos.env" . | nindent 12 }}
          {{- include "aos.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.jobs.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "aos.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "aos.volumes" . | nindent 8 }}
      {{- with .Values.jobs.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.jobs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
