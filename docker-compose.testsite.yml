# Test-site mode for the local stack: invite-link sign-in, the site's pages, optionally the real model.
# Started by ops/test-site.sh, which creates .env.testsite with the secrets these settings read.
services:
  api:
    environment: &site
      CHAT_ENV: staging
      CHAT_AUTH_PROVIDER: invite
      CHAT_WEB_DIR: /app/web
      CHAT_INVITE_SECRET: ${CHAT_INVITE_SECRET:?start the test site with ops/test-site.sh}
      CHAT_DATA_ENCRYPTION_KEYS: ${CHAT_DATA_ENCRYPTION_KEYS:?start the test site with ops/test-site.sh}
      CHAT_MODEL_BASE_URL: ${CHAT_MODEL_BASE_URL:-http://model:8003/v1}
      CHAT_MODEL_NAME: ${CHAT_MODEL_NAME:-media-slm-dev}
      CHAT_MODEL_API_KEY: ${CHAT_MODEL_API_KEY:-}
      # More models (see .env.testsite): Google Gemini, Ollama on this computer, any other OpenAI-compatible host
      CHAT_GEMINI_API_KEY: ${CHAT_GEMINI_API_KEY:-}
      CHAT_GEMINI_MODEL: ${CHAT_GEMINI_MODEL:-gemini-3.5-flash-lite}
      CHAT_OLLAMA_BASE_URL: ${CHAT_OLLAMA_BASE_URL:-}
      CHAT_OLLAMA_MODELS: ${CHAT_OLLAMA_MODELS:-qwen2.5:7b}
      CHAT_MODELS: ${CHAT_MODELS:-}
      CHAT_DEFAULT_MODEL: ${CHAT_DEFAULT_MODEL:-}
      CHAT_PAYMENT_PROVIDER: manual
      CHAT_GLOBAL_DAILY_HOST_TOKEN_CEILING: "5000000"
    extra_hosts: ["host.docker.internal:host-gateway"]  # Ollama on this computer (Docker Desktop has it already)
  jobs:
    environment: *site
