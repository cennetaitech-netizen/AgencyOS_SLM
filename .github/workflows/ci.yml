name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat
          POSTGRES_DB: chat_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CHAT_ENV: test
      CHAT_DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
      CHAT_TEST_DATABASE_URL: postgresql+asyncpg://chat:chat@localhost:5432/chat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check chat_service tests migrations ml
      - run: ruff format --check chat_service tests
      - name: Migration applies and matches the schema
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  widget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
