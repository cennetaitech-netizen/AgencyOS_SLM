name: container

# Builds the image and runs the whole stack (docker compose --profile monitoring) to check that it starts and works
# end to end: API, migrations, Redis, stand-in model host, jobs, Prometheus with the alert rules, Grafana with the
# dashboard. Also checks that the image runs as a non-root user and refuses to start with an unsafe production config.

on:
  push:
    paths: ["Dockerfile", "docker-compose.yml", ".dockerignore", "pyproject.toml", "chat_service/**", "widget/**", "render.yaml",
            "migrations/**", "ops/**", ".github/workflows/container.yml"]
  pull_request:
    paths: ["Dockerfile", "docker-compose.yml", ".dockerignore", "pyproject.toml", "chat_service/**", "widget/**", "render.yaml",
            "migrations/**", "ops/**", ".github/workflows/container.yml"]
  workflow_dispatch:

jobs:
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t agencyos-assistant:ci .

      - name: Image runs as a non-root user
        run: test "$(docker run --rm agencyos-assistant:ci id -u)" = "10001"

      - name: Image contains the test site's pages
        run: docker run --rm agencyos-assistant:ci test -f /app/web/index.html

      - name: Image refuses to start with an unsafe production config
        run: |
          set +e
          out=$(timeout 60 docker run --rm agencyos-assistant:ci python -c \
            "from chat_service.api.app import create_app; create_app()" 2>&1)
          code=$?
          set -e
          echo "$out" | tail -15
          test $code -ne 0 && echo "$out" | grep -q "unsafe production configuration"

      - name: Start the stack with monitoring
        run: docker compose --profile monitoring up -d --build

      - name: Smoke test (API, chat stream, metrics, Prometheus, Grafana)
        run: |
          python3 ops/smoke_stack.py --api http://localhost:8090 --prometheus http://localhost:9090 \
            --grafana http://localhost:3000 --metrics-token dev-metrics-token --timeout 240

      - name: Jobs container is running
        run: test "$(docker compose ps --status running --services | grep -c '^jobs$')" = "1"

      - name: Test site on a laptop (ops/test-site.sh), checked end to end
        run: |
          link=$(ops/test-site.sh --no-browser | tail -1)
          python3 ops/check_test_site.py --link "$link"
          # a restart keeps the same staff link
          test "$(ops/test-site.sh --no-browser | tail -1)" = "$link"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose --profile monitoring logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: |
          docker compose --profile monitoring down -v

  image-scan:
    runs-on: ubuntu-latest
    needs: stack
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agencyos-assistant:ci .
      - name: Scan the image for known vulnerabilities (fixable critical ones fail the job)
        # Trivy's own container image (pinned); its vulnerability database is downloaded fresh on every run.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 \
            image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress agencyos-assistant:ci
